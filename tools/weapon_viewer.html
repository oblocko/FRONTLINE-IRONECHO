<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>Weapon viewer</title>
<style>html,body{margin:0;background:#2a2d30;overflow:hidden}canvas{display:block}#l{position:fixed;left:8px;top:6px;color:#ccc;font:12px monospace}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/examples/jsm/": "./vendor/three/examples/jsm/" } }</script>
</head><body><div id="l">side · 3/4 · first-person hip · ADS  (pistol: ?w=pistol)</div>
<script type="module">
// Dev tool: renders the first-person weapon models in four views for review.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { buildRifle, buildPistol } from './src/player/WeaponModels.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1; document.body.appendChild(r.domElement);
r.setScissorTest(true);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3f44);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight(0xb0b8c8, 0x30302a, 0.9)); const key = new THREE.DirectionalLight(0xdde4ff, 1.4); key.position.set(1, 2, 1); scene.add(key);
const w = new URLSearchParams(location.search).get('w') || 'rifle';
const model = w === 'pistol' ? buildPistol() : buildRifle();
scene.add(model);
const u = model.userData; if (u.dot) { u.dot.visible = true; u.ring.visible = true; }
const W = innerWidth / 2, H = innerHeight / 2;
const cams = [];
const ortho = (pos, look, size) => { const c = new THREE.PerspectiveCamera(22, W / H, 0.01, 10); c.position.copy(pos); c.lookAt(look); return c; };
const L = w === 'pistol' ? 1.0 : 2.3;
cams.push(ortho(new THREE.Vector3(L, 0.0, w === 'pistol' ? 0.0 : -0.18), new THREE.Vector3(0, w === 'pistol' ? 0.0 : -0.04, w === 'pistol' ? 0.0 : -0.2)));
cams.push(ortho(new THREE.Vector3(L * 0.55, L * 0.25, -L * 0.6), new THREE.Vector3(0, w === 'pistol' ? 0.0 : -0.03, w === 'pistol' ? 0.0 : -0.2)));
// first-person: same transforms as WeaponSystem (vm camera at origin looking -Z, fov 60)
const fp = (hipOrAds) => { const c = new THREE.PerspectiveCamera(hipOrAds ? 52 : 60, W / H, 0.01, 10);
  const off = hipOrAds ? new THREE.Vector3(0, -u.sightY, -(w === 'pistol' ? 0.42 : 0.26) - u.sightZ) : (w === 'pistol' ? new THREE.Vector3(0.12, -0.1, -0.4) : new THREE.Vector3(0.145, -0.165, -0.46));
  c.position.copy(off).negate(); c.lookAt(c.position.clone().add(new THREE.Vector3(0, 0, -1))); return c; };
cams.push(fp(false)); cams.push(fp(true));
const vp = [[0, H], [W, H], [0, 0], [W, 0]];
cams.forEach((c, i) => { r.setViewport(vp[i][0], vp[i][1], W, H); r.setScissor(vp[i][0], vp[i][1], W, H); r.render(scene, c); });
window.__ready = true;
</script></body></html>
